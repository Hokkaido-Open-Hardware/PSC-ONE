[package]
name = "psc-os"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false

[features]
firmware = []
user = []
pulp = []
# Disabled by default, like PSC_OS_DEBUG_WITHOUT_MICROPYTHON in the C shell.
micropython = []
# Host validation links the same TJpgDec ABI through the test runner.
jpeg-host = []

[[bin]]
name = "user"
path = "src/bin/user.rs"
required-features = ["firmware", "user"]

[[bin]]
name = "kernel"
path = "src/bin/kernel.rs"
required-features = ["firmware"]

[[example]]
name = "yolo_reference"
required-features = ["jpeg-host"]

[[bin]]
name = "bootrom"
path = "src/bin/bootrom.rs"
required-features = ["firmware"]

[[bin]]
name = "bootloader_fat32"
path = "src/bin/bootloader_fat32.rs"
required-features = ["firmware"]
